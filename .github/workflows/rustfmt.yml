name: Rustfmt check

# Self-hosted runner variant: no marketplace actions. rustfmt needs the nightly
# toolchain because the repo uses unstable formatting options.
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/rustfmt.yml'
      - 'userspace/**'
      - 'rustfmt.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/rustfmt.yml'
      - 'userspace/**'
      - 'rustfmt.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check toolchain
        run: |
          set -eux
          rustup toolchain list
          rustup run nightly rustfmt --version

      - name: Run rustfmt
        run: |
          set -eux
          # The stable toolchain is the default; the repo formats with nightly
          # because rustfmt.toml uses unstable options.
          cargo +nightly fmt --all --check
